services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.day3}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.day3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.day3}
      AICRM_AUTH_PASSWORD: ${AICRM_AUTH_PASSWORD:?Set AICRM_AUTH_PASSWORD in .env.day3}
      AICRM_APP_PASSWORD: ${AICRM_APP_PASSWORD:?Set AICRM_APP_PASSWORD in .env.day3}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env.day3}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/20-provision-runtime-roles.sh:/docker-entrypoint-initdb.d/20-provision-runtime-roles.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env.day3} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env.day3}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.4.0-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in .env.day3}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
  inventory-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${INVENTORY_MYSQL_DATABASE:-carvix_inventory_fixture}
      MYSQL_USER: ${INVENTORY_MYSQL_USER:-carvix_inventory_reader}
      MYSQL_PASSWORD: ${INVENTORY_MYSQL_PASSWORD:?Set INVENTORY_MYSQL_PASSWORD in .env.day3}
      MYSQL_ROOT_PASSWORD: ${INVENTORY_MYSQL_ROOT_PASSWORD:?Set INVENTORY_MYSQL_ROOT_PASSWORD in .env.day3}
    ports:
      - '127.0.0.1:${INVENTORY_MYSQL_PORT:-3307}:3306'
    volumes:
      - inventory-mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/10-inventory-fixture.sql:/docker-entrypoint-initdb.d/10-inventory-fixture.sql:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-p${INVENTORY_MYSQL_ROOT_PASSWORD:?Set INVENTORY_MYSQL_ROOT_PASSWORD in .env.day3}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  inventory-mysql-data:
